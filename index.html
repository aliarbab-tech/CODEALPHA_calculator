<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator" id="calculator">
  <div class="screen">
    <div class="history" id="history">&nbsp;</div>
    <div class="display" id="display">0</div>
  </div>

  <div class="keys">
    <button class="key op-key" data-action="clear">AC</button>
    <button class="key op-key" data-action="negate">+/&minus;</button>
    <button class="key op-key" data-action="percent">%</button>
    <button class="key operator" data-op="÷">&divide;</button>

    <button class="key" data-num="7">7</button>
    <button class="key" data-num="8">8</button>
    <button class="key" data-num="9">9</button>
    <button class="key operator" data-op="×">&times;</button>

    <button class="key" data-num="4">4</button>
    <button class="key" data-num="5">5</button>
    <button class="key" data-num="6">6</button>
    <button class="key operator" data-op="−">&minus;</button>

    <button class="key" data-num="1">1</button>
    <button class="key" data-num="2">2</button>
    <button class="key" data-num="3">3</button>
    <button class="key operator" data-op="+">+</button>

    <button class="key key-zero" data-num="0">0</button>
    <button class="key" data-action="decimal">.</button>
    <button class="key operator equals" data-action="equals">=</button>
  </div>
</div>

<p class="hint">Keyboard works too — numbers, + &minus; * / . Enter Backspace Escape</p>

<script src="script.js"></script>
</body>
</html>
